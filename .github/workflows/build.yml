name: Build and Push Image

on:
  push:
    branches: [main]
    paths:
      - 'apps.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

  # Rogzitett referencia. 'main' eseten ket build ugyanabbol az apps.json-bol
  # KULONBOZO image-et adhat, ha kozben a Containerfile valtozott.
  # SHA forrasa: https://github.com/frappe/frappe_docker/commits/main
  FRAPPE_DOCKER_REF: a0c52135d4d41c4b8acf7adfdfc5bbcba46dd4d0

  # Az alap image SOHA nem tartalmazhatja ezt az appot.
  TILTOTT_APP: hegyesihq

  # =================================================================
  #  A FRAPPE VERZIOJA ES AZ ESZKOZLANC KULON ROGZITVE (F2.4z/B)
  #
  #  A frappe_docker Containerfile-ja egyetlen FRAPPE_BRANCH valtozot
  #  hasznal ket celra: (1) a frappe/build es frappe/base eszkozlanc-
  #  image cimkeje, (2) a klonozott frappe ag/cimke. A frappe/build
  #  image-eket a Frappe az ERPNext kiadasaihoz cimkezi (2026-10-09:
  #  v16.50.0 van, v16.51.0 nincs), ezert a ketto szetvalik:
  #    FRAPPE_IMAGE_TAG -> eszkozlanc (Python, Node, rendszerkonyvtarak)
  #    FRAPPE_REF       -> maga a keretrendszer (git cimke)
  #  A 'version-16' mozgo ag helyett cimke: ket build ugyanabbol a
  #  commitbol ugyanazt adja.
  # =================================================================
  FRAPPE_REF: v16.51.0
  FRAPPE_IMAGE_TAG: v16.50.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      # =================================================================
      #  ELLENORZES A BUILD ELOTT  (~1 masodperc)
      #
      #  Ez a lepes azert letezik, mert egy elgepelt agnev korabban 40 perc
      #  utan derult ki. Itt 1 masodperc alatt derul ki.
      #
      #  Ket dolgot ellenoriz:
      #   1. Minden apps.json hivatkozas letezik-e (ag VAGY cimke)
      #   2. A sajat appunk NINCS-E benne  <- ez a leak-vedelem valodi
      #      kockazatot fedo resze: a realis hibaut az, hogy valaki
      #      beirja az apps.json-ba. Az alap image PUBLIKUS registrybe
      #      megy, tehat oda sajat kod nem kerulhet.
      # =================================================================
      - name: apps.json ellenorzese
        run: |
          echo ">>> Hivatkozasok ellenorzese"
          HIBA=0
          while read -r url ref; do
            if   git ls-remote --exit-code "$url" "refs/heads/$ref" >/dev/null 2>&1; then
              printf '  OK    ag     %-14s <- %s\n' "$ref" "$url"
            elif git ls-remote --exit-code "$url" "refs/tags/$ref"  >/dev/null 2>&1; then
              printf '  OK    cimke  %-14s <- %s\n' "$ref" "$url"
            else
              printf '  HIBA         %-14s <- %s  (nincs ilyen ag vagy cimke)\n' "$ref" "$url"
              HIBA=1
            fi
          done < <(jq -r '.[] | "\(.url) \(.branch)"' apps.json)

          echo ""
          echo ">>> Orszem: a sajat app nem lehet az alap image-ben"
          if jq -r '.[].url' apps.json | grep -qi "/${TILTOTT_APP}\(\.git\)\?$"; then
            echo "  !!! BLOKKOLO: a '${TILTOTT_APP}' szerepel az apps.json-ban."
            echo "  !!! Ez az image PUBLIKUS registrybe menne -> az uzleti logika kiszivarogna."
            echo "  !!! A sajat app kizarolag a helyi app-reteg image-be kerulhet."
            HIBA=1
          else
            echo "  OK    a '${TILTOTT_APP}' nincs az apps.json-ban"
          fi

          echo ""
          echo ">>> A frappe cimke es az eszkozlanc-image"
          if git ls-remote --exit-code https://github.com/frappe/frappe "refs/tags/${FRAPPE_REF}" >/dev/null 2>&1; then
            echo "  OK    frappe cimke ${FRAPPE_REF}"
          else
            echo "  HIBA  nincs ilyen frappe cimke: ${FRAPPE_REF}"; HIBA=1
          fi
          for img in build base; do
            if docker manifest inspect "frappe/${img}:${FRAPPE_IMAGE_TAG}" >/dev/null 2>&1; then
              echo "  OK    frappe/${img}:${FRAPPE_IMAGE_TAG}"
            else
              echo "  HIBA  nincs ilyen image: frappe/${img}:${FRAPPE_IMAGE_TAG}"; HIBA=1
            fi
          done

          [ "$HIBA" -eq 0 ] || { echo ""; echo "!!! A build el sem indul."; exit 1; }
          echo ""
          echo ">>> Minden rendben, indulhat a build."

      # -----------------------------------------------------------------
      #  Egyedi, VISSZAGURITHATO tag.  v16-<datum>-<rovid_sha>-<run_number>
      #  A run_number miatt minden build egyedi -> felulirhatatlan.
      # -----------------------------------------------------------------
      - name: Compute image tag
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          UNIQUE="v16-${DATE}-${SHORT_SHA}-${{ github.run_number }}"
          echo "unique_tag=${UNIQUE}" >> "$GITHUB_OUTPUT"
          echo ">>> Egyedi tag: ${UNIQUE}"

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}

      # -----------------------------------------------------------------
      #  A Containerfile kulon ARG-ot kap a frappe cimkehez (FRAPPE_REF).
      #  Ha a frappe_docker modositana a sort, a build megall: nem
      #  epitunk csendben a mozgo agrol.
      # -----------------------------------------------------------------
      - name: A frappe cimke bekotese a Containerfile-ba
        run: |
          F=frappe_docker/images/layered/Containerfile
          grep -q -- '--frappe-branch=${FRAPPE_BRANCH}' "$F" \
            || { echo "!!! A Containerfile megvaltozott, a csere nem alkalmazhato."; exit 1; }
          sed -i 's|--frappe-branch=${FRAPPE_BRANCH}|--frappe-branch=${FRAPPE_REF}|' "$F"
          sed -i '0,/^ARG CACHE_BUST=""/s//ARG CACHE_BUST=""\nARG FRAPPE_REF/' "$F"
          grep -q -- '--frappe-branch=${FRAPPE_REF}' "$F" && grep -q '^ARG FRAPPE_REF$' "$F" \
            || { echo "!!! A csere nem sikerult."; exit 1; }
          echo ">>> builder szakasz:"; sed -n '1,22p' "$F"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =================================================================
      #  BUILD + PUSH
      #
      #  push: true  -> a buildx a retegeket KOZVETLENUL a registrybe tolja,
      #  parhuzamosan. A korabbi "load: true" ehelyett tarball-kent
      #  exportalta a 4-6 GB-os image-et, visszaimportalta a Docker
      #  demonba, es csak utana toltotte fel: 10-20 perc plusz.
      #
      #  Csak az EGYEDI tag kerul fel. A mozgo ':v16' mutato CSAK sikeres
      #  ellenorzes utan, kulon lepesben.
      #
      #  cache mode=min: a Containerfile lenyegeben egyetlen nagy RUN
      #  lepes, ezert a 'max' szinte semmit nem gyorsit, viszont sok
      #  gigabajtot exportal a GitHub cache-be (repnkent 10 GB a korlat).
      # =================================================================
      - name: Build and push (egyedi tag)
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.unique_tag }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_IMAGE_TAG }}
            FRAPPE_REF=${{ env.FRAPPE_REF }}
          # Az apps.json tartalma NEM kerul be az image reteg-metaadatba.
          secret-files: |
            apps_json=${{ github.workspace }}/apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # =================================================================
      #  ELLENORZES A KESZ IMAGE-EN
      #  Ez a lepes azt fogja el, ha egy app kimaradt (pl. hianyzo
      #  fuggoseg, mint anno az lms -> payments). Egyben azt is bizonyitja,
      #  hogy a feltoltott image tenylegesen hasznalhato.
      # =================================================================
      - name: Az appok listaja az image-ben
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.unique_tag }}"
          docker run --rm --entrypoint bash "$IMG" \
            -c "ls -1 /home/frappe/frappe-bench/apps/" | tee /tmp/apps_in_image.txt

      - name: Minden elvart app benne van-e
        run: |
          EXPECTED="frappe $(jq -r '.[].url' apps.json | sed 's#.*/##; s#\.git$##')"
          MISSING=""
          for app in $EXPECTED; do
            if grep -qx "$app" /tmp/apps_in_image.txt; then
              echo "  OK   $app"
            else
              echo "  HIBA $app  <-- HIANYZIK"
              MISSING="$MISSING $app"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo ""
            echo "!!! A kovetkezo appok nincsenek az image-ben:$MISSING"
            echo "!!! A ':v16' mutato NEM kerul at erre az image-re."
            exit 1
          fi
          echo ""
          echo ">>> OK: minden elvart app benne van."

      # -----------------------------------------------------------------
      #  A keretrendszer-harmas verzioja az image-ben = a rogzitett cimke.
      #  (A frappe a FRAPPE_REF-bol, az erpnext es a hrms az apps.json-bol.)
      # -----------------------------------------------------------------
      - name: Verziok ellenorzese az image-ben
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.unique_tag }}"
          HIBA=0
          for app in frappe erpnext hrms; do
            if [ "$app" = frappe ]; then VART="${FRAPPE_REF#v}"; else
              VART=$(jq -r --arg a "$app" '.[] | select(.url | endswith("/" + $a)) | .branch' apps.json); VART="${VART#v}"; fi
            VAN=$(docker run --rm --entrypoint bash "$IMG" -c \
              "grep -m1 -oP '__version__ = \"\K[^\"]+' /home/frappe/frappe-bench/apps/$app/$app/__init__.py")
            if [ "$VAN" = "$VART" ]; then echo "  OK   $app $VAN"; else echo "  HIBA $app: $VAN (vart: $VART)"; HIBA=1; fi
          done
          [ "$HIBA" -eq 0 ] || { echo "!!! A ':v16' mutato NEM kerul at erre az image-re."; exit 1; }

      # =================================================================
      #  A MOZGO MUTATO - csak sikeres ellenorzes utan
      #
      #  Az imagetools szerveroldali masolas: nem tolt le es nem tolt fel
      #  semmit, azonnali. A ':v16' KENYELMI mutato - a stack .env-je
      #  SOHA ne erre mutasson, hanem az egyedi tagre.
      # =================================================================
      - name: A ':v16' mutato atallitasa
        run: |
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v16" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.unique_tag }}"

      - name: Osszegzes
        run: |
          echo ">>> Kesz. A stack .env-jebe ez az ertek kerul:"
          echo ""
          echo "    TAG=${{ steps.meta.outputs.unique_tag }}"
