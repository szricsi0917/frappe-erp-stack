name: Build and Push Image

on:
  push:
    branches: [main]
    paths:
      - 'apps.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # kezi inditas az "Actions" fulrol

# ---------------------------------------------------------------------
#  Automatikus heti rebuild - SZANDEKOSAN kikapcsolva.
#  Production ERP-nel a rebuild legyen tudatos dontes, ne utemezett,
#  mert a develop agas appok tipje barmikor valtozhat.
# ---------------------------------------------------------------------
#  schedule:
#    - cron: '0 3 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

  # ---------------------------------------------------------------------
  #  VALTOZAS (F0.3): rogzitett referencia.
  #  'main' eseten ket build ugyanabbol az apps.json-bol KULONBOZO image-et
  #  adhat, ha kozben a Containerfile valtozott -> egy eles hiba nem
  #  vezetheto vissza. A SHA forrasa:
  #    https://github.com/frappe/frappe_docker/commits/main
  #  Frissiteskor tudatos dontes: uj SHA + uj build + PROBA telepites.
  # ---------------------------------------------------------------------
  FRAPPE_DOCKER_REF: a0c52135d4d41c4b8acf7adfdfc5bbcba46dd4d0

  # Az alap image SOHA nem tartalmazhatja ezt az appot.
  # Reszletes indoklas a "Guard" lepesnel.
  TILTOTT_APP: hegyesihq

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      #  Egyedi, VISSZAGURITHATO tag eloallitasa.
      #  Formatum:  v16-<datum>-<rovid_sha>-<run_number>
      #  A run_number miatt minden build egyedi -> felulirhatatlan.
      # -----------------------------------------------------------------
      - name: Compute image tag
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          UNIQUE="v16-${DATE}-${SHORT_SHA}-${{ github.run_number }}"
          echo "unique_tag=${UNIQUE}" >> "$GITHUB_OUTPUT"
          echo ">>> Egyedi tag: ${UNIQUE}"

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =================================================================
      #  1. EPITES - PUSH NELKUL
      #
      #  VALTOZAS (F0.3): korabban itt "push: true" allt, es az ellenorzes
      #  utana futott. Egy leak-vedelem, ami a leak UTAN fut le, nem
      #  vedelem: ami egyszer publikus registrybe kerult, azt lehuzhattak.
      #  Ezert az image eloszor CSAK a futtato gepre toltodik (load: true),
      #  ott fut minden ellenorzes, es csak utana megy a push.
      # =================================================================
      - name: Build image (push nelkul)
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: local/frappe-erp-stack:build
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
          # Az apps.json tartalma NEM kerul be az image reteg-metaadatba.
          secret-files: |
            apps_json=${{ github.workspace }}/apps.json
          # VALTOZAS (F0.3): a cache eddig irva volt, de SOSEM olvasva.
          # A cache-from nelkul minden build nullarol indult.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =================================================================
      #  2. ELLENORZESEK - meg a push elott
      # =================================================================
      - name: Az appok listaja az image-ben
        id: apps
        run: |
          docker run --rm --entrypoint bash local/frappe-erp-stack:build \
            -c "ls -1 /home/frappe/frappe-bench/apps/" | tee /tmp/apps_in_image.txt

      - name: Minden elvart app benne van-e
        run: |
          # Elvart appok = frappe (build-arg) + minden apps.json bejegyzes
          EXPECTED="frappe $(jq -r '.[].url' apps.json | sed 's#.*/##; s#\.git$##')"

          MISSING=""
          for app in $EXPECTED; do
            if grep -qx "$app" /tmp/apps_in_image.txt; then
              echo "  OK   $app"
            else
              echo "  HIBA $app  <-- HIANYZIK"
              MISSING="$MISSING $app"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo ""
            echo "!!! A build HIBAS: a kovetkezo appok nincsenek az image-ben:$MISSING"
            echo "!!! Valoszinu ok: hianyzo fuggoseg vagy rossz branch az apps.json-ban."
            exit 1
          fi
          echo ""
          echo ">>> OK: minden elvart app benne van."

      # -----------------------------------------------------------------
      #  ORSZEM: sajat appkod nem kerulhet a publikus alap image-be.
      #
      #  A kepletet ketto image alkotja:
      #    - ALAP image  (ez): csak upstream, nyilt forrasu kod -> GHCR,
      #      publikus lehet, mert nincs benne semmi sajat.
      #    - APP-RETEG (helyben, az Unraiden): a hegyesihq app -> SEHOVA
      #      nem kerul fel.
      #
      #  Ez az ellenorzes tartja fenn a hatarvonalat. Ha valaha az apps.json
      #  vagy a Containerfile ugy valtozna, hogy a sajat app is beepulne,
      #  a build ITT all meg - a push elott.
      # -----------------------------------------------------------------
      - name: Guard - a sajat app NEM lehet az alap image-ben
        run: |
          if grep -qx "${{ env.TILTOTT_APP }}" /tmp/apps_in_image.txt; then
            echo "!!! BLOKKOLO: a '${{ env.TILTOTT_APP }}' app bekerult az ALAP image-be."
            echo "!!! Ez az image PUBLIKUS registrybe menne -> az uzleti logika kiszivarogna."
            echo "!!! A build leall, push NEM tortenik."
            exit 1
          fi
          echo ">>> OK: a '${{ env.TILTOTT_APP }}' nincs az alap image-ben."

      # =================================================================
      #  3. PUSH - csak sikeres ellenorzes utan
      #
      #  Nem uj buildet inditunk, hanem a mar ellenorzott, helyi image-et
      #  cimkezzuk es toljuk fel. Igy garantalt, hogy PONTOSAN az kerul
      #  fel, amit ellenoriztunk.
      # =================================================================
      - name: Tag es push
        run: |
          LOCAL="local/frappe-erp-stack:build"
          UNIQUE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.unique_tag }}"
          MOVING="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v16"

          # unique : EZ a visszaguritas alapja, a stack .env-je ezt hasznalja
          # v16    : mozgo "legfrissebb" mutato, KENYELEMBOL. A stack SOHA
          #          ne erre mutasson.
          docker tag "$LOCAL" "$UNIQUE"
          docker tag "$LOCAL" "$MOVING"

          docker push "$UNIQUE"
          docker push "$MOVING"

          echo ""
          echo ">>> Feltoltve: $UNIQUE"
          echo ">>> Ezt az erteket ird a stack .env-jebe TAG-kent."
